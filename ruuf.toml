# Passive example. Select it explicitly with --manifest ruuf.toml check.
# Create a separate instance with: python launcher/ruufd.py init DIRECTORY --id NAME
[agent]
id = "example"

[places.logs]
path = "logs"
holds = "Process output for this instance."
optional = true

[places.launcher]
path = "run"
holds = "Supervisor state for this instance."
optional = true
